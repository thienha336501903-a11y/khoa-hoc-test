<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Culinary CMS - Quản Trị Khóa Học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async></script>

  <style>
    /* ── RESET + BASE ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: #f4f6f8;
      color: #1a1a2e;
      min-height: 100vh;
    }
    a { color: inherit; }
    button { cursor: pointer; font-family: inherit; }
    input, textarea, select {
      font-family: inherit;
      font-size: 0.9rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 7px 10px;
      outline: none;
      width: 100%;
      background: #fff;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: #2563eb; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.8rem; color: #374151; }
    textarea { resize: vertical; min-height: 80px; }

    /* ── LAYOUT ───────────────────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── HEADER ───────────────────────────────────────────────────────────── */
    #header {
      background: #1e293b;
      color: #fff;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      flex-shrink: 0;
      gap: 12px;
    }
    #header .brand { font-weight: 800; font-size: 1rem; letter-spacing: -0.3px; }
    #header .brand span { color: #f59e0b; }
    #header .hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #header .admin-email { font-size: 0.75rem; color: #94a3b8; }
    #driveBadge {
      font-size: 0.7rem; font-weight: 700; padding: 3px 10px;
      border-radius: 99px; background: #374151; color: #9ca3af;
    }
    #driveBadge.connected { background: #14532d; color: #86efac; }
    #driveBadge.pending { background: #78350f; color: #fcd34d; }

    /* ── BUTTONS ──────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 14px; border-radius: 6px; border: none;
      font-weight: 700; font-size: 0.8rem; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-green  { background: #16a34a; color: #fff; }
    .btn-orange { background: #ea580c; color: #fff; }
    .btn-gray   { background: #e5e7eb; color: #374151; }
    .btn-red    { background: #dc2626; color: #fff; }
    .btn-sm     { padding: 4px 10px; font-size: 0.75rem; }
    .btn-xs     { padding: 3px 8px;  font-size: 0.7rem; }
    .btn-drive  { background: #1967d2; color: #fff; }
    .btn-logout { background: #475569; color: #fff; }
    .btn-full   { width: 100%; justify-content: center; padding: 10px 14px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── LOGIN SCREEN ─────────────────────────────────────────────────────── */
    #loginScreen {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: #fff; border-radius: 14px; padding: 40px 36px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1); max-width: 400px; width: 100%;
      text-align: center;
    }
    .login-card h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
    .login-card p  { color: #6b7280; font-size: 0.85rem; margin-bottom: 28px; }
    #loginStatusMsg { font-size: 0.8rem; color: #dc2626; margin-top: 14px; min-height: 18px; }

    /* ── WORKSPACE ────────────────────────────────────────────────────────── */
    #workspace {
      flex: 1; display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      overflow: hidden;
    }
    @media (max-width: 768px) {
      #workspace { grid-template-columns: 1fr; }
    }

    /* ── LEFT PANEL ───────────────────────────────────────────────────────── */
    #leftPanel {
      background: #fff;
      border-right: 1px solid #e5e7eb;
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .panel-section {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
    }
    .panel-section h2 {
      font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.6px; color: #6b7280; margin-bottom: 10px;
    }
    .course-row { display: flex; gap: 6px; }
    .course-row select { flex: 1; }
    .course-meta-fields { display: flex; flex-direction: column; gap: 8px; }
    #lessonList { flex: 1; overflow-y: auto; }
    .lesson-item {
      padding: 10px 16px; border-bottom: 1px solid #f1f5f9;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: background 0.1s;
    }
    .lesson-item:hover { background: #f8fafc; }
    .lesson-item.active { background: #eff6ff; border-left: 3px solid #2563eb; }
    .lesson-item .lesson-no {
      font-size: 0.7rem; font-weight: 700; color: #2563eb;
      background: #dbeafe; padding: 2px 7px; border-radius: 99px; margin-right: 8px;
    }
    .lesson-item .lesson-title { font-size: 0.85rem; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lesson-item.hidden-lesson { opacity: 0.45; }
    .lesson-item .del-btn { color: #dc2626; font-size: 0.75rem; margin-left: 6px; flex-shrink: 0; }

    /* ── RIGHT PANEL ──────────────────────────────────────────────────────── */
    #rightPanel {
      overflow-y: auto; padding: 20px 24px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .form-card {
      background: #fff; border-radius: 10px;
      border: 1px solid #e5e7eb; overflow: hidden;
    }
    .form-card-header {
      background: #f8fafc; padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; justify-content: space-between;
    }
    .form-card-header h3 {
      font-size: 0.85rem; font-weight: 800; color: #1e293b;
    }
    .form-card-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group.span-full { grid-column: 1 / -1; }
    .input-with-btn { display: flex; gap: 6px; }
    .input-with-btn input { flex: 1; }

    /* ── MEDIA BLOCKS ─────────────────────────────────────────────────────── */
    #mediaBlocksContainer { display: flex; flex-direction: column; gap: 10px; }
    .media-block {
      border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;
    }
    .media-block-header {
      background: #f8fafc; padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
    }
    .media-block-type {
      font-size: 0.7rem; font-weight: 800; padding: 2px 8px; border-radius: 99px;
    }
    .type-video   { background: #dbeafe; color: #1d4ed8; }
    .type-youtube { background: #fee2e2; color: #b91c1c; }
    .type-image   { background: #dcfce7; color: #15803d; }
    .media-block-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .media-block-fields { display: grid; grid-template-columns: 1fr 2fr; gap: 6px; }
    .media-block-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .media-block-status {
      font-size: 0.75rem; padding: 6px 10px; border-radius: 6px; margin-top: 2px;
    }
    .status-ok  { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .status-err { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
    .status-info{ background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .media-preview { margin-top: 6px; }
    .media-preview iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 6px; }
    .media-preview img { max-width: 100%; max-height: 200px; object-fit: contain; border-radius: 6px; border: 1px solid #e5e7eb; }
    .add-media-row { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ── RECIPE SECTION ───────────────────────────────────────────────────── */
    .recipe-section { display: flex; flex-direction: column; gap: 10px; }

    /* ── TOAST ────────────────────────────────────────────────────────────── */
    #toastContainer {
      position: fixed; bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 8px; z-index: 9000;
    }
    .toast {
      padding: 10px 16px; border-radius: 8px; font-size: 0.82rem; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15); min-width: 240px;
      animation: slideIn 0.2s ease;
    }
    .toast-success { background: #166534; color: #fff; }
    .toast-error   { background: #7f1d1d; color: #fff; }
    .toast-info    { background: #1e3a5f; color: #fff; }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ── OVERLAY LOADER ───────────────────────────────────────────────────── */
    #loader {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; z-index: 8000;
    }
    #loader.hidden { display: none; }
    .loader-box {
      background: #fff; border-radius: 12px; padding: 28px 36px;
      text-align: center; font-weight: 600; color: #374151;
    }
    .spinner {
      width: 36px; height: 36px; border: 4px solid #e5e7eb;
      border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR MODAL ──────────────────────────────────────────────────────── */
    #errorModal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center; z-index: 9500; padding: 20px;
    }
    #errorModal.hidden { display: none; }
    .error-modal-box {
      background: #fff; border-radius: 12px; max-width: 560px; width: 100%;
      overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .error-modal-header {
      background: #7f1d1d; color: #fff; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .error-modal-header h3 { font-size: 0.95rem; }
    .error-modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
    .error-field label { color: #6b7280; font-size: 0.75rem; font-weight: 700; }
    .error-field .val { font-size: 0.82rem; color: #1a1a2e; word-break: break-all; }
    #errorModalCopyBtn { background: #374151; color: #fff; }
    .error-modal-footer { padding: 12px 20px; border-top: 1px solid #f1f5f9; display: flex; justify-content: flex-end; gap: 8px; }

    /* ── FORM FOOTER ──────────────────────────────────────────────────────── */
    .form-footer { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

    /* ── MISC ─────────────────────────────────────────────────────────────── */
    .hidden { display: none !important; }
    .divider { border: none; border-top: 1px solid #e5e7eb; }
    #footer { padding: 10px 20px; text-align: center; font-size: 0.7rem; color: #9ca3af; background: #fff; border-top: 1px solid #e5e7eb; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── LOADER ──────────────────────────────────────────────────────────── -->
  <div id="loader" class="hidden">
    <div class="loader-box">
      <div class="spinner"></div>
      <div id="loaderMsg">Đang xử lý...</div>
    </div>
  </div>

  <!-- ── ERROR MODAL ─────────────────────────────────────────────────────── -->
  <div id="errorModal" class="hidden">
    <div class="error-modal-box">
      <div class="error-modal-header">
        <h3 id="errorModalTitle">Lỗi</h3>
        <button class="btn btn-xs" style="background:rgba(255,255,255,0.2);color:#fff" onclick="closeErrorModal()">✕ Đóng</button>
      </div>
      <div class="error-modal-body" id="errorModalBody"></div>
      <div class="error-modal-footer">
        <button class="btn btn-sm" id="errorModalCopyBtn" onclick="copyErrorDetails()">Sao chép lỗi</button>
        <button class="btn btn-sm btn-gray" onclick="closeErrorModal()">Đóng</button>
      </div>
    </div>
  </div>

  <!-- ── TOAST CONTAINER ─────────────────────────────────────────────────── -->
  <div id="toastContainer"></div>

  <!-- ── HEADER ──────────────────────────────────────────────────────────── -->
  <div id="header" class="hidden">
    <div class="brand">🍳 Culinary <span>CMS</span></div>
    <div class="hdr-right">
      <span class="admin-email" id="hdrEmail"></span>
      <span id="driveBadge">Drive: Chưa kết nối</span>
      <button class="btn btn-drive btn-sm" onclick="connectDrive()">🔗 Kết nối Google Drive</button>
      <button class="btn btn-logout btn-sm" onclick="logoutAdmin()">Đăng xuất</button>
    </div>
  </div>

  <!-- ── LOGIN SCREEN ─────────────────────────────────────────────────────── -->
  <div id="loginScreen">
    <div class="login-card">
      <h1>🍳 Culinary CMS</h1>
      <p>Hệ thống quản trị khóa học. Đăng nhập bằng tài khoản Gmail Admin.</p>
      <div id="googleSignInBtn" style="display:flex;justify-content:center;"></div>
      <div id="loginStatusMsg"></div>
    </div>
  </div>

  <!-- ── WORKSPACE ─────────────────────────────────────────────────────────── -->
  <div id="workspace" class="hidden">

    <!-- LEFT PANEL -->
    <div id="leftPanel">

      <!-- Course selector -->
      <div class="panel-section">
        <h2>1. Khóa Học</h2>
        <div class="course-row">
          <select id="courseSelect" onchange="onCourseChange()">
            <option value="">-- Chọn khóa học --</option>
          </select>
          <button class="btn btn-green btn-sm" onclick="showNewCourseInput()">+</button>
        </div>
        <div id="newCourseRow" class="course-row hidden" style="margin-top:6px;">
          <input id="newCourseInput" type="text" placeholder="tên-khóa-học-mới" />
          <button class="btn btn-green btn-sm" onclick="addCourseSlug()">Thêm</button>
        </div>
      </div>

      <!-- Course meta -->
      <div class="panel-section">
        <h2>Cấu Hình Khóa Học</h2>
        <div class="course-meta-fields">
          <div class="field-group">
            <label>Tiêu đề</label>
            <input id="metaTitle" type="text" placeholder="Khóa học Bánh Mì..." />
          </div>
          <div class="field-group">
            <label>Phụ đề</label>
            <input id="metaSubtitle" type="text" placeholder="Học làm bánh chuyên nghiệp..." />
          </div>
          <div class="field-group">
            <label>Ảnh banner (URL)</label>
            <input id="metaHeroImage" type="text" placeholder="https://..." />
          </div>
          <button class="btn btn-primary btn-sm btn-full" onclick="saveCourseMeta()">Lưu cấu hình khóa học</button>
        </div>
      </div>

      <!-- Lessons list -->
      <div class="panel-section" style="padding-bottom:8px;">
        <h2 style="display:flex;align-items:center;justify-content:space-between;">
          2. Danh Sách Bài Học
          <button class="btn btn-green btn-xs" onclick="initNewLesson()">+ Thêm mới</button>
        </h2>
      </div>
      <div id="lessonList"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rightPanel">

      <!-- Lesson form -->
      <div class="form-card">
        <div class="form-card-header">
          <h3 id="formTitle">Thêm Bài Học Mới</h3>
          <span id="formModeBadge" style="font-size:0.7rem;font-weight:700;padding:2px 10px;background:#dbeafe;color:#1d4ed8;border-radius:99px;">TẠO MỚI</span>
        </div>
        <div class="form-card-body">

          <!-- Row 1 -->
          <div class="field-row">
            <div class="field-group">
              <label>Slug khóa học</label>
              <input id="fCourse" type="text" readonly style="background:#f1f5f9;color:#64748b;" />
            </div>
            <div class="field-group">
              <label>Bài số</label>
              <input id="fLesson" type="number" min="1" placeholder="1" />
            </div>
          </div>

          <!-- Row 2: Title full width -->
          <div class="field-group">
            <label>Tiêu đề bài học</label>
            <input id="fTitle" type="text" placeholder="Ví dụ: Tổng quan lý thuyết bánh mì" />
          </div>

          <!-- Row 3: Description -->
          <div class="field-group">
            <label>Mô tả ngắn</label>
            <textarea id="fDescription" rows="2" placeholder="Mô tả nội dung bài học..."></textarea>
          </div>

          <!-- Row 4 -->
          <div class="field-row three">
            <div class="field-group">
              <label>Thời lượng</label>
              <input id="fDuration" type="text" placeholder="15:30" />
            </div>
            <div class="field-group">
              <label>Cấp độ</label>
              <select id="fLevel">
                <option>Cơ bản</option>
                <option>Trung cấp</option>
                <option>Nâng cao</option>
                <option>Chuyên nghiệp</option>
              </select>
            </div>
            <div class="field-group">
              <label>Trạng thái</label>
              <select id="fStatus">
                <option value="active">Hiển thị (active)</option>
                <option value="hidden">Ẩn (hidden)</option>
              </select>
            </div>
          </div>

          <!-- Row 5: Thumbnail -->
          <div class="field-group">
            <label>Ảnh đại diện (Thumbnail URL)</label>
            <div class="input-with-btn">
              <input id="fThumbnailUrl" type="text" placeholder="https://..." />
              <label class="btn btn-orange btn-sm" style="white-space:nowrap;cursor:pointer;">
                Tải ảnh
                <input type="file" accept="image/*" class="hidden" onchange="handleThumbnailUpload(this)" />
              </label>
            </div>
          </div>

          <!-- Row 6: Main video URL -->
          <div class="field-group">
            <label>Video bài giảng chính (Bunny / YouTube)</label>
            <div class="input-with-btn">
              <input id="fVideoUrl" type="text" placeholder="Dán link hoặc iframe Bunny / YouTube..." />
              <button class="btn btn-gray btn-sm" onclick="testMainVideoUrl()" style="white-space:nowrap;">Kiểm tra</button>
            </div>
            <div id="mainVideoStatus" style="margin-top:4px;"></div>
          </div>

          <hr class="divider" />

          <!-- RECIPE SECTION -->
          <div class="recipe-section">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <label style="margin:0;font-size:0.85rem;">📄 Công Thức (Google Docs)</label>
            </div>
            <textarea id="recipeText" rows="4" placeholder="Nhập hoặc dán văn bản công thức vào đây..."></textarea>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:0.78rem;color:#6b7280;">Hoặc tải file .txt:</span>
              <input type="file" id="recipeFileInput" accept=".txt" style="width:auto;font-size:0.78rem;" onchange="handleRecipeFile(this)" />
            </div>
            <button class="btn btn-primary btn-sm" onclick="createGoogleDoc()">📝 Tạo Google Docs từ công thức</button>
            <div class="field-group">
              <label>Link tài liệu công thức (recipeUrl)</label>
              <div class="input-with-btn">
                <input id="fRecipeUrl" type="text" placeholder="https://docs.google.com/..." />
                <a id="recipeOpenLink" href="#" target="_blank" class="btn btn-gray btn-sm hidden">Mở</a>
              </div>
            </div>
          </div>

          <hr class="divider" />

          <!-- MEDIA BLOCKS -->
          <div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <label style="margin:0;font-size:0.85rem;">🌾 Media Phụ (mediaUrls)</label>
              <button class="btn btn-gray btn-xs" onclick="previewMediaUrls()">Xem mediaUrls</button>
            </div>
            <div id="mediaBlocksContainer"></div>
            <div class="add-media-row" style="margin-top:10px;">
              <button class="btn btn-sm" style="background:#dbeafe;color:#1d4ed8;" onclick="addMediaBlock('video')">+ Video Bunny</button>
              <button class="btn btn-sm" style="background:#fee2e2;color:#b91c1c;" onclick="addMediaBlock('youtube')">+ YouTube</button>
              <button class="btn btn-sm" style="background:#dcfce7;color:#15803d;" onclick="addMediaBlock('image')">+ Ảnh</button>
            </div>
          </div>

          <hr class="divider" />

          <!-- FORM FOOTER -->
          <div class="form-footer">
            <button class="btn btn-gray" onclick="initNewLesson()">Đặt lại</button>
            <button class="btn btn-green" onclick="saveLesson()">💾 Lưu bài học</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div id="footer" class="hidden">
    Culinary CMS &nbsp;|&nbsp; <span id="buildVersionLabel"></span>
  </div>

</div><!-- #app -->

<script>
// ════════════════════════════════════════════════════════════════════════════
// ADMIN CMS — REBUILT CLEAN 2026-06-07
// ════════════════════════════════════════════════════════════════════════════

const ADMIN_BUILD_VERSION = "admin-rebuild-clean-2026-06-07-01";
console.log("ADMIN_BUILD_VERSION", ADMIN_BUILD_VERSION);

// ── STATE ──────────────────────────────────────────────────────────────────
const STATE = {
  adminEmail: "",
  sessionToken: "",
  // Drive OAuth — only populated after explicit user action
  driveAccessToken: "",
  driveTokenExpiry: 0,
  // Drive token client (initialized lazily)
  driveTokenClient: null,
  // Callback waiting for token
  driveTokenResolve: null,
  driveTokenReject: null,
  // Course data
  courses: [],

// ── ERROR MODAL ─────────────────────────────────────────────────────────────
function showErrorModal(data, titleText = "Lỗi") {
  STATE.currentErrorData = data;
  document.getElementById("errorModalTitle").textContent = titleText;

  const body = document.getElementById("errorModalBody");
  body.innerHTML = "";

  const fields = [
    ["Lỗi",         data.error   || data.message],
    ["Mô tả",       data.message !== data.error ? data.message : null],
    ["Mã lỗi",      data.code],
    ["Lý do",       data.reason],
    ["Gợi ý",       data.hint],
    ["Thêm",        data.extra ? JSON.stringify(data.extra, null, 2) : null],
    ["Google Errors", data.googleErrors ? JSON.stringify(data.googleErrors, null, 2) : null],
  ];

  for (const [label, val] of fields) {
    if (!val) continue;
    const div = document.createElement("div");
    div.className = "error-field";
    div.innerHTML = `<label>${label}</label><div class="val" style="white-space:pre-wrap;">${escHtml(String(val))}</div>`;
    body.appendChild(div);
  }

  document.getElementById("errorModal").classList.remove("hidden");
}
function closeErrorModal() {
  document.getElementById("errorModal").classList.add("hidden");
}
function copyErrorDetails() {
  const text = JSON.stringify(STATE.currentErrorData, null, 2);
  navigator.clipboard.writeText(text).then(
    () => toast("Đã sao chép lỗi vào clipboard"),
    () => { prompt("Sao chép lỗi:", text); }
  );
}

// ── HTML ESCAPE ─────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ── GOOGLE SIGN-IN ──────────────────────────────────────────────────────────
async function initGoogleSignIn() {
  let googleClientId = "";
  try {
    const r = await fetch("/api/public-config");
    const d = await r.json();
    googleClientId = d.googleClientId || "";
  } catch (e) {
    document.getElementById("loginStatusMsg").textContent = "Không tải được cấu hình Google.";
    return;
  }

  if (!googleClientId) {
    document.getElementById("loginStatusMsg").textContent = "Thiếu GOOGLE_CLIENT_ID trên Vercel.";
    return;
  }

  // Wait for GSI library
  await waitForGSI();

  google.accounts.id.initialize({
    client_id: googleClientId,
    callback: handleGoogleSignIn,
  });

  google.accounts.id.renderButton(
    document.getElementById("googleSignInBtn"),
    { theme: "outline", size: "large", text: "signin_with", shape: "pill" }
  );

  // Try restore session
  const saved = localStorage.getItem("admin_session_token");
  if (saved) {
    showLoader("Đang khôi phục phiên...");
    await tryRestoreSession(saved);
  }
}

function waitForGSI() {
  return new Promise((resolve) => {
    if (typeof google !== "undefined" && google.accounts) return resolve();
    const t = setInterval(() => {
      if (typeof google !== "undefined" && google.accounts) { clearInterval(t); resolve(); }
    }, 100);
  });
}

async function handleGoogleSignIn(response) {
  showLoader("Đang xác thực admin...");
  try {
    const r = await fetch("/api/admin-auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ credential: response.credential }),
    });
    const d = await r.json();
    if (d.success) {
      localStorage.setItem("admin_session_token", d.sessionToken);
      enterWorkspace(d.email, d.sessionToken);
    } else {
      showErrorModal(d, "Đăng nhập thất bại");
      document.getElementById("loginStatusMsg").textContent = d.error || "Không có quyền truy cập.";
    }
  } catch (e) {
    toast("Lỗi kết nối server", "error");
  } finally {
    hideLoader();
  }
}

async function tryRestoreSession(token) {
  try {
    const r = await fetch("/api/admin-auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionToken: token }),
    });
    const d = await r.json();
    if (d.success) {
      enterWorkspace(d.email, d.sessionToken || token);
    } else {
      localStorage.removeItem("admin_session_token");
    }
  } catch (e) {
    localStorage.removeItem("admin_session_token");
  } finally {
    hideLoader();
  }
}

// ── GOOGLE DRIVE OAUTH ─────────────────────────────────────────────────────
// initDriveTokenClient: only sets up the client object, never triggers popup
function initDriveTokenClient() {
  if (STATE.driveTokenClient) return;
  if (typeof google === "undefined" || !google.accounts?.oauth2) {
    console.warn("GSI oauth2 not ready yet — will retry on first Drive action.");
    return;
  }

  const googleClientId = "";  // Will be read from public config
  // We need the client_id. Re-read from public-config if needed.
  fetch("/api/public-config")
    .then(r => r.json())
    .then(d => {
      if (!d.googleClientId) return;
      STATE.driveTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: d.googleClientId,
        scope: "https://www.googleapis.com/auth/drive.file",
        callback: (response) => {
          if (response.error) {
            if (STATE.driveTokenReject) {
              STATE.driveTokenReject(new Error(response.error_description || response.error));
              STATE.driveTokenReject = null;
              STATE.driveTokenResolve = null;
            }
            clearDriveTokenStorage();
            return;
          }
          const token = response.access_token;
          if (!token) {
            if (STATE.driveTokenReject) {
              STATE.driveTokenReject(new Error("Không nhận được access_token từ Google."));
              STATE.driveTokenReject = null;
              STATE.driveTokenResolve = null;
            }
            clearDriveTokenStorage();
            return;
          }
          STATE.driveAccessToken = token;
          STATE.driveTokenExpiry = Date.now() + (response.expires_in || 3600) * 1000 - 30000;
          localStorage.setItem("driveAccessToken", token);
          localStorage.setItem("driveTokenExpiry", STATE.driveTokenExpiry);
          console.log("DRIVE_ACCESS_TOKEN_PRESENT", Boolean(STATE.driveAccessToken));
          updateDriveBadge(true);

          if (STATE.driveTokenResolve) {
            STATE.driveTokenResolve(token);
            STATE.driveTokenResolve = null;
            STATE.driveTokenReject = null;
          }
        },
      });
    })
    .catch(() => {});
}

function updateDriveBadge(connected) {
  const badge = document.getElementById("driveBadge");
  if (connected) {
    badge.textContent = "Drive: Đã kết nối ✓";
    badge.className = "connected";
    badge.classList.add("connected");
  } else {
    badge.textContent = "Drive: Chưa kết nối";
    badge.className = "";
  }
}

function clearDriveTokenStorage() {
  localStorage.removeItem("driveAccessToken");
  localStorage.removeItem("driveTokenExpiry");
  localStorage.removeItem("driveEmail");
  STATE.driveAccessToken = "";
  STATE.driveTokenExpiry = 0;
  updateDriveBadge(false);
}

async function restoreDriveToken() {
  const token = localStorage.getItem("driveAccessToken");
  const expiry = localStorage.getItem("driveTokenExpiry");

  if (token && expiry && Date.now() < Number(expiry)) {
    // Thử xác thực với server trước khi chính thức chấp nhận
    try {
      const r = await fetch("/api/admin-drive-auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionToken: STATE.sessionToken, accessToken: token }),
      });
      const d = await r.json();

      if (d.success) {
        STATE.driveAccessToken = token;
        STATE.driveTokenExpiry = Number(expiry);
        updateDriveBadge(true);
        console.log("Drive token restored successfully from storage.");
      } else {
        clearDriveTokenStorage();
      }
    } catch (e) {
      console.error("Error verifying restored Drive token:", e);
    }
  } else {
    clearDriveTokenStorage();
  }
}

// ensureDriveAccess: returns access token, requesting it if needed
// This is the ONLY place where Drive OAuth popup can be triggered
function ensureDriveAccess() {
  return new Promise((resolve, reject) => {
    // If we have a valid token already, return it immediately
    if (STATE.driveAccessToken && Date.now() < STATE.driveTokenExpiry) {
      console.log("DRIVE_ACCESS_TOKEN_PRESENT", true);
      resolve(STATE.driveAccessToken);
      return;
    }

    // Need to request token
    if (!STATE.driveTokenClient) {
      // Re-initialize if not ready
      initDriveTokenClient();
      setTimeout(() => {
        if (!STATE.driveTokenClient) {
          reject(new Error("Google OAuth client chưa sẵn sàng. Vui lòng thử lại sau vài giây."));
          return;
        }
        requestDriveToken(resolve, reject);
      }, 1500);
      return;
    }

    requestDriveToken(resolve, reject);
  });
}

function requestDriveToken(resolve, reject) {
  STATE.driveTokenResolve = resolve;
  STATE.driveTokenReject = reject;
  updateDriveBadge(false);

  try {
    STATE.driveTokenClient.requestAccessToken({ prompt: "consent" });
  } catch (e) {
    STATE.driveTokenResolve = null;
    STATE.driveTokenReject = null;
    reject(e);
  }
}

// connectDrive: called when user explicitly clicks "Kết nối Google Drive"
async function connectDrive() {
  updateDriveBadge(false);
  document.getElementById("driveBadge").textContent = "Drive: Đang kết nối...";
  document.getElementById("driveBadge").className = "pending";

  try {
    const token = await ensureDriveAccess();

    // Verify with server
    const r = await fetch("/api/admin-drive-auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionToken: STATE.sessionToken, accessToken: token }),
    });
    const d = await r.json();

    if (d.success) {
      localStorage.setItem("driveAccessToken", token);
      localStorage.setItem("driveTokenExpiry", STATE.driveTokenExpiry);
      localStorage.setItem("driveEmail", d.email || "");
      updateDriveBadge(true);
      toast("Kết nối Google Drive thành công!");
    } else if (d.needsOAuth) {
      clearDriveTokenStorage();
      toast(d.error || "Cần xin lại quyền Google Drive.", "error");
    } else {
      clearDriveTokenStorage();
      showErrorModal(d, "Lỗi kết nối Drive");
    }
  } catch (e) {
    clearDriveTokenStorage();
    toast("Bạn chưa cấp quyền Google Drive cho Admin CMS.", "error");
  }
}

function testMainVideoUrl() {
  const raw = document.getElementById("fVideoUrl").value.trim();

  const bunny = parseBunnyUrl(raw);
  if (bunny.ok) {

    return;
  }
  const yt = parseYouTubeUrl(raw);
  if (yt.ok) {

}

// ── URL PARSERS (Client-side mirrors of admin-utils.js) ───────────────────
function extractIframeSrc(input) {
  const text = String(input || "").trim();
  const m = text.match(/<iframe[^>]+src=["']([^"']+)["']/i);
  return m ? m[1].trim() : text;
}

function parseBunnyUrl(input) {
  let src = extractIframeSrc(input).replace(/&amp;/g, "&").trim();
  if (!src) return { ok: false };
  try {
    const url = new URL(src);
    const host = url.hostname.replace(/^www\./, "");
    if (["player.mediadelivery.net","iframe.mediadelivery.net","video.bunnycdn.com"].includes(host)) {
      const parts = url.pathname.split("/").filter(Boolean);
      const mode = parts[0], libraryId = parts[1], videoId = parts[2];
      if ((mode === "embed" || mode === "play") && libraryId && videoId) {
        return { ok: true, url: `https://iframe.mediadelivery.net/embed/${libraryId}/${videoId}`, libraryId, videoId };
      }
    }
  } catch {}
  const m = src.match(/(?:player|iframe)\.mediadelivery\.net\/(?:embed|play)\/([^/]+)\/([^/?#\s]+)/);
  if (m) return { ok: true, url: `https://iframe.mediadelivery.net/embed/${m[1]}/${m[2]}`, libraryId: m[1], videoId: m[2] };
  return { ok: false };
}

function parseYouTubeUrl(input) {
  let text = extractIframeSrc(input).replace(/&amp;/g, "&").trim();
  const extractId = (u) => {
    try {
      const parsed = new URL(u);
      const host = parsed.hostname.replace(/^www\./, "");
      if (host === "youtu.be") { const id = parsed.pathname.split("/").filter(Boolean)[0]; if (id) return id; }
      if (["youtube.com","m.youtube.com","youtube-nocookie.com"].includes(host)) {
        if (parsed.searchParams.get("v")) return parsed.searchParams.get("v");
        const parts = parsed.pathname.split("/").filter(Boolean);
        if (["embed","shorts","live"].includes(parts[0]) && parts[1]) return parts[1];
      }
    } catch {}
    return "";
  };
  let videoId = extractId(text);
  if (!videoId) {
    const m = text.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (m) videoId = m[1];
  }
  if (videoId) return { ok: true, url: `https://www.youtube.com/watch?v=${videoId}`, videoId };
  return { ok: false };
}

// ── MEDIA BLOCKS ─────────────────────────────────────────────────────────────
let blockIdCounter = 0;

function addMediaBlock(type, titleVal = "", urlVal = "") {
  const id = `mb_${++blockIdCounter}`;
  const typeLabelClass = type === "video" ? "type-video" : type === "youtube" ? "type-youtube" : "type-image";
  const typeLabel = type === "video" ? "Bunny Video" : type === "youtube" ? "YouTube Video" : "Ảnh";
  const placeholder = type === "video"
    ? "Dán link hoặc iframe Bunny Stream..."
    : type === "youtube"
    ? "Dán link YouTube..."
    : "Dán link ảnh Drive hoặc URL ảnh...";

  const div = document.createElement("div");
  div.className = "media-block";
  // ── data-media-block, data-media-type để buildMediaUrls() nhận diện chính xác
  div.setAttribute("data-media-block", "");
  div.setAttribute("data-media-type", type);
  div.id = id;

  div.innerHTML = `
    <div class="media-block-header">
      <span class="media-block-type ${typeLabelClass}">${typeLabel}</span>
      <button class="btn btn-xs btn-red" onclick="document.getElementById('${id}').remove()">Xóa</button>
    </div>
    <div class="media-block-body">
      <div class="media-block-fields">
        <input data-media-title class="mb-title" type="text" placeholder="Tên hiển thị..." value="${escHtml(titleVal)}" />
        <div class="input-with-btn">
          <input data-media-url class="mb-url" type="text" placeholder="${placeholder}" value="${escHtml(urlVal)}" />
          ${type === "image" ? `<label class="btn btn-orange btn-xs" style="cursor:pointer;white-space:nowrap;">Tải<input type="file" accept="image/*" class="hidden" onchange="handleImageUploadForBlock('${id}',this)" /></label>` : ""}
          <button class="btn btn-gray btn-xs" onclick="checkMediaBlock('${id}')">Kiểm tra</button>
        </div>
      </div>
      <div class="mb-status"></div>
      <div class="mb-preview media-preview"></div>
    </div>
  `;

  document.getElementById("mediaBlocksContainer").appendChild(div);

  // Auto-check if URL already has value
  if (urlVal) setTimeout(() => checkMediaBlock(id), 0);
}

function checkMediaBlock(id) {
  const block = document.getElementById(id);
  if (!block) return;
  const type = block.dataset.type;
  const urlInput = block.querySelector(".mb-url");
  const statusEl = block.querySelector(".mb-status");
  const previewEl = block.querySelector(".mb-preview");
  const raw = urlInput.value.trim();
  previewEl.innerHTML = "";

  if (!raw) { statusEl.innerHTML = ""; return; }

  if (type === "video") {
    const bunny = parseBunnyUrl(raw);
    if (bunny.ok) {
      urlInput.value = bunny.url;
      statusEl.innerHTML = `<div class="media-block-status status-ok">✓ Bunny hợp lệ — Library: <b>${bunny.libraryId}</b> | Video: <b>${bunny.videoId}</b><br><small>Preview thật chỉ phát trên web học viên sau khi server ký token.</small></div>`;
    } else {
      statusEl.innerHTML = `<div class="media-block-status status-err">⚠ Không nhận ra Bunny link. Kiểm tra lại.</div>`;
    }
    return;
  }

  if (type === "youtube") {
    const yt = parseYouTubeUrl(raw);
    if (yt.ok) {
      urlInput.value = yt.url;
      statusEl.innerHTML = `<div class="media-block-status status-ok">✓ YouTube hợp lệ — ID: <b>${yt.videoId}</b></div>`;
      previewEl.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt.videoId}" allowfullscreen></iframe>`;
    } else {
      statusEl.innerHTML = `<div class="media-block-status status-err">⚠ Không nhận ra YouTube link.</div>`;
    }
    return;
  }

  if (type === "image") {
    // Try to preview the image directly
    let displayUrl = raw;
    const driveMatch = raw.match(/drive\.google\.com\/file\/d\/([^/]+)/) || raw.match(/[?&]id=([^&]+)/);
    if (driveMatch) displayUrl = `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
    statusEl.innerHTML = `<div class="media-block-status status-info">Đang kiểm tra ảnh...</div>`;
    const img = new Image();
    img.onload = () => {
      statusEl.innerHTML = `<div class="media-block-status status-ok">✓ Ảnh hợp lệ.</div>`;
      previewEl.innerHTML = `<img src="${escHtml(displayUrl)}" alt="Preview" />`;
    };
    img.onerror = () => {
      statusEl.innerHTML = `<div class="media-block-status status-err">⚠ Không tải được ảnh. Kiểm tra quyền chia sẻ Drive hoặc URL.</div>`;
    };
    img.src = displayUrl;
  }
}

// ── BUILD mediaUrls ──────────────────────────────────────────────────────────
// Dùng data-media-block / data-media-type / data-media-title / data-media-url
// KHÔNG bỏ block nếu thiếu title — dùng title fallback theo type
function buildMediaUrls() {
  const blocks = Array.from(document.querySelectorAll("[data-media-block]"));

  const result = blocks.map(block => {
    const type = block.dataset.mediaType || "";
    const titleInput = block.querySelector("[data-media-title]");
    const urlInput   = block.querySelector("[data-media-url]");

    const rawTitle = String(titleInput?.value || "").trim();
    const url      = String(urlInput?.value   || "").trim().replace(/[|\n\r]/g, "");

    if (!type || !url) return "";  // url bắt buộc; type bắt buộc

    // Fallback title nếu user bỏ trống
    const safeTitle = (rawTitle.replace(/[|\n\r]/g, "-") || (
      type === "video"   ? "Video Bunny"  :
      type === "youtube" ? "Video YouTube" :
      "Ảnh"
    ));

    return `${type}|${safeTitle}|${url}`;
  }).filter(Boolean).join("\n");

  console.log("MEDIA_URLS_BUILT", result);
  return result;
}

function previewMediaUrls() {
  const built = buildMediaUrls();
  if (!built) { toast("Chưa có media block nào.", "info"); return; }
  const lines = built.split("\n").map(l => `• ${l}`).join("\n");
  showErrorModal({ error: "Xem trước mediaUrls", message: lines }, "Xem trước mediaUrls");
}

// ── RECIPE ──────────────────────────────────────────────────────────────────
function handleRecipeFile(input) {
  const file = input.files[0];
  if (!file) return;
  STATE.recipeFileName = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    // Store raw base64
    STATE.recipeFileBase64 = reader.result.split(",")[1] || reader.result;
    toast(`Đã chọn file: ${file.name}`);
  };
  reader.readAsDataURL(file);
}

async function createGoogleDoc() {
  const course = document.getElementById("fCourse").value;
  const lesson = document.getElementById("fLesson").value;
  const title  = document.getElementById("fTitle").value.trim();
  const text   = document.getElementById("recipeText").value.trim();

  if (!course || !lesson || !title) {
    toast("Điền đầy đủ khóa học, số bài và tiêu đề trước.", "error");
    return;
  }
  if (!text && !STATE.recipeFileBase64) {
    toast("Nhập nội dung công thức hoặc chọn file .txt.", "error");
    return;
  }

  let token;
  try {
    token = await ensureDriveAccess();
  } catch (e) {
    toast("Bạn chưa cấp quyền Google Drive cho Admin CMS.", "error");
    return;
  }

  console.log("DRIVE_ACCESS_TOKEN_PRESENT", Boolean(token));

  showLoader("Đang tạo Google Docs...");
  try {
    const body = { course, lesson, title, accessToken: token };
    if (STATE.recipeFileBase64) {
      body.fileData = STATE.recipeFileBase64;
      body.fileName = STATE.recipeFileName;
    } else {
      body.text = text;
    }

    const r = await fetch("/api/admin-upload-recipe", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...authHeaders() },
      body: JSON.stringify(body),
    });
    const d = await r.json();

    if (d.needsOAuth) {
      toast(d.hint || "Cần cấp quyền Drive.", "error");
      return;
    }
    if (!d.success) {
      showErrorModal(d, "Lỗi tạo Google Docs");
      return;
    }

    document.getElementById("fRecipeUrl").value = d.recipeUrl;
    const link = document.getElementById("recipeOpenLink");
    link.href = d.recipeUrl;
    link.classList.remove("hidden");
    STATE.recipeFileBase64 = "";
    STATE.recipeFileName = "";
    document.getElementById("recipeFileInput").value = "";

    if (d.warning) {
      toast(d.warning, "warning");
    } else {
      toast("Tạo Google Docs thành công và cập nhật Google Sheet!");
    }

    if (course) {
      await reloadLessonListOnly(course);
    }
  } catch (e) {
    toast("Lỗi kết nối khi tạo Google Docs", "error");
  } finally {
    hideLoader();
  }
}

// ── IMAGE UPLOAD ─────────────────────────────────────────────────────────────
async function handleThumbnailUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const url = await uploadImageFile(file);
  if (url) document.getElementById("fThumbnailUrl").value = url;
}

async function handleImageUploadForBlock(blockId, input) {
  const file = input.files[0];
  if (!file) return;
  const url = await uploadImageFile(file, blockId);
  if (url) {
    const block = document.getElementById(blockId);
    if (block) {
      block.querySelector(".mb-url").value = url;
      checkMediaBlock(blockId);
    }
  }
}

async function uploadImageFile(file, context = "") {
  let token;
  try {
    token = await ensureDriveAccess();
  } catch (e) {
    toast("Bạn chưa cấp quyền Google Drive cho Admin CMS.", "error");
    return null;
  }

  console.log("DRIVE_ACCESS_TOKEN_PRESENT", Boolean(token));

  const course = document.getElementById("fCourse").value;
  const lesson = document.getElementById("fLesson").value;
  const title  = document.getElementById("fTitle").value.trim() || file.name;

  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = async () => {
      showLoader("Đang tải ảnh lên Drive...");
      try {
        const r = await fetch("/api/admin-upload-image", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify({
            fileData: reader.result,
            fileName: file.name,
            mimeType: file.type,
            course, lesson, title,
            accessToken: token,
          }),
        });
        const d = await r.json();

        if (d.needsOAuth) {
          toast(d.hint || "Cần cấp quyền Drive.", "error");
          resolve(null);
          return;
        }
        if (!d.success) {
          showErrorModal(d, "Lỗi upload ảnh");
          resolve(null);
          return;
        }

        toast("Upload ảnh thành công!");
        resolve(d.directUrl);
      } catch (e) {
        toast("Lỗi kết nối khi upload ảnh", "error");
        resolve(null);
      } finally {
        hideLoader();
      }
    };
    reader.readAsDataURL(file);
  });
}

// ── SAVE LESSON ──────────────────────────────────────────────────────────────
async function saveLesson() {
  const course       = document.getElementById("fCourse").value;
  const lesson       = document.getElementById("fLesson").value.trim();
  const title        = document.getElementById("fTitle").value.trim();
  const description  = document.getElementById("fDescription").value.trim();
  const duration     = document.getElementById("fDuration").value.trim();
  const level        = document.getElementById("fLevel").value;
  const status       = document.getElementById("fStatus").value;
  const thumbnailUrl = document.getElementById("fThumbnailUrl").value.trim();
  const videoUrl     = document.getElementById("fVideoUrl").value.trim();
  const recipeUrl    = document.getElementById("fRecipeUrl").value.trim();

  // ── mediaUrls: bắt buộc build trước validate ──────────────────────────────
  const mediaUrls = buildMediaUrls();
  console.log("MEDIA_BLOCKS_FOUND", document.querySelectorAll("[data-media-block]").length);
  console.log("MEDIA_URLS_BUILT", mediaUrls);

  if (!course) { toast("Chọn khóa học trước.", "error"); return; }
  if (!lesson)  { toast("Nhập số bài học.", "error"); return; }
  if (!title)   { toast("Nhập tiêu đề bài học.", "error"); return; }

  const lessonData = { course, lesson, title, description, duration, level, status, thumbnailUrl, videoUrl, recipeUrl, mediaUrls };
  // ── Đảm bảo mediaUrls luôn tồn tại trong lessonData ──────────────────────
  lessonData.mediaUrls = mediaUrls;

  console.log("LESSON_DATA_BEFORE_SAVE", lessonData);
  console.log("LESSON_DATA_BEFORE_SAVE.mediaUrls", lessonData.mediaUrls);

  const payload = {
    action:         STATE.isEditMode ? "update" : "create",
    course,
    lesson,
    originalCourse: STATE.isEditMode ? STATE.originalCourse : undefined,
    originalLesson: STATE.isEditMode ? STATE.originalLesson : undefined,
    lessonData,
  };

  showLoader("Đang lưu bài học...");
  try {
    const r = await fetch("/api/admin-lessons", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...authHeaders() },
      body: JSON.stringify(payload),
    });
    const d = await r.json();

    if (d.success) {
      toast(STATE.isEditMode ? "Cập nhật bài học thành công!" : "Tạo bài học mới thành công!");
      await loadLessons(course);
    } else {
      showErrorModal(d, "Lỗi lưu bài học");
    }
  } catch (e) {
    toast("Lỗi kết nối khi lưu bài học", "error");
  } finally {
    hideLoader();
  }
}

// ── DELETE LESSON ─────────────────────────────────────────────────────────────
async function deleteLesson(course, lesson) {
  if (!confirm(`Ẩn bài học ${lesson} khóa học "${course}"?`)) return;
  showLoader("Đang ẩn bài học...");
  try {
    const r = await fetch("/api/admin-lessons", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...authHeaders() },
      body: JSON.stringify({ action: "delete", course, lesson }),
    });
    const d = await r.json();

    if (d.success) {
      toast(d.message || "Đã ẩn bài học.");
      await loadLessons(course);
      initNewLesson();
    } else {
      showErrorModal(d, "Lỗi ẩn bài học");
    }
  } catch (e) {
    toast("Lỗi kết nối khi ẩn bài học", "error");
  } finally {
    hideLoader();
  }
}

// ── AUTH HEADERS ─────────────────────────────────────────────────────────────
function authHeaders() {
  return STATE.sessionToken
    ? { Authorization: `Bearer ${STATE.sessionToken}` }
    : {};
}

  document.getElementById("buildVersionLabel").textContent = ADMIN_BUILD_VERSION;
  initGoogleSignIn();
});
</script>
